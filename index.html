<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#07111f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Minha Meta PRO</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --bg:#07111f;
    --bg2:#0b1728;
    --card:#101e30;
    --card2:#14253a;
    --green:#28d17c;
    --green2:#18a866;
    --blue:#4da3ff;
    --purple:#8d72ff;
    --orange:#ffb84d;
    --red:#ff667d;
    --text:#f5f8fc;
    --muted:#91a0b4;
    --border:rgba(255,255,255,.08);
    --shadow:0 15px 40px rgba(0,0,0,.25);
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:
        radial-gradient(circle at 80% -10%,rgba(40,209,124,.15),transparent 30%),
        radial-gradient(circle at 10% 10%,rgba(77,163,255,.12),transparent 30%),
        var(--bg);
    color:var(--text);
    min-height:100vh;
    padding-bottom:90px;
}

button,
input,
select{
    font:inherit;
}

button{
    border:0;
    cursor:pointer;
}

.app{
    max-width:700px;
    margin:auto;
    padding:18px 16px 100px;
}

/* HEADER */

.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.brand{
    display:flex;
    align-items:center;
    gap:10px;
}

.brand-icon{
    width:42px;
    height:42px;
    border-radius:14px;
    background:linear-gradient(135deg,#1b2e48,#07111f);
    border:1px solid rgba(255,255,255,.1);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:21px;
}

.brand-text strong{
    display:block;
    font-size:17px;
}

.brand-text span{
    display:block;
    font-size:11px;
    color:var(--green);
    font-weight:bold;
    letter-spacing:1.5px;
}

.user-circle{
    width:40px;
    height:40px;
    border-radius:50%;
    background:linear-gradient(135deg,var(--green),#08784b);
    display:flex;
    justify-content:center;
    align-items:center;
    font-weight:bold;
}

/* SECTIONS */

.page{
    display:none;
}

.page.active{
    display:block;
    animation:fade .25s ease;
}

@keyframes fade{
    from{opacity:0;transform:translateY(5px)}
    to{opacity:1;transform:translateY(0)}
}

.section-title{
    margin:22px 0 12px;
}

.section-title h2{
    font-size:20px;
}

.section-title p{
    color:var(--muted);
    font-size:13px;
    margin-top:4px;
}

/* HERO */

.hero{
    background:
        radial-gradient(circle at 100% 0%,rgba(40,209,124,.25),transparent 40%),
        linear-gradient(145deg,#12263c,#0c192a);
    border:1px solid rgba(255,255,255,.08);
    border-radius:25px;
    padding:22px;
    box-shadow:var(--shadow);
    position:relative;
    overflow:hidden;
}

.pro-label{
    display:inline-flex;
    align-items:center;
    gap:5px;
    color:#06140e;
    background:var(--green);
    padding:6px 10px;
    border-radius:999px;
    font-size:10px;
    font-weight:bold;
    letter-spacing:1px;
    margin-bottom:15px;
}

.hero-small{
    color:var(--muted);
    font-size:13px;
}

.hero-value{
    font-size:38px;
    font-weight:800;
    margin:5px 0 3px;
    letter-spacing:-1px;
}

.hero-sub{
    color:var(--muted);
    font-size:12px;
}

.hero-progress{
    margin-top:20px;
}

.progress-line{
    width:100%;
    height:9px;
    background:rgba(255,255,255,.08);
    border-radius:99px;
    overflow:hidden;
}

.progress-fill{
    height:100%;
    background:linear-gradient(90deg,var(--green),#75e7aa);
    border-radius:99px;
    width:0%;
    transition:width .7s ease;
}

.progress-info{
    display:flex;
    justify-content:space-between;
    margin-top:8px;
    font-size:12px;
    color:var(--muted);
}

/* METRICS */

.metrics{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
    margin-top:12px;
}

.metric{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:18px;
    padding:15px;
}

.metric-icon{
    font-size:20px;
    margin-bottom:9px;
}

.metric-label{
    color:var(--muted);
    font-size:11px;
}

.metric-value{
    font-size:18px;
    font-weight:bold;
    margin-top:3px;
}

/* CHART */

.card{
    background:rgba(16,30,48,.9);
    border:1px solid var(--border);
    border-radius:22px;
    padding:18px;
    margin-top:12px;
}

.card-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
}

.card-title{
    font-weight:bold;
    font-size:16px;
}

.card-subtitle{
    color:var(--muted);
    font-size:11px;
    margin-top:4px;
}

.periods{
    display:flex;
    gap:5px;
    background:#0a1625;
    border-radius:12px;
    padding:4px;
}

.periods button{
    background:transparent;
    color:var(--muted);
    padding:7px 8px;
    border-radius:9px;
    font-size:10px;
}

.periods button.active{
    background:var(--green);
    color:#04150d;
    font-weight:bold;
}

.chart{
    height:210px;
    margin-top:18px;
    position:relative;
    border-left:1px solid rgba(255,255,255,.08);
    border-bottom:1px solid rgba(255,255,255,.08);
    overflow:hidden;
}

.chart-grid{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
}

.chart-grid div{
    border-top:1px dashed rgba(255,255,255,.06);
    width:100%;
}

.chart svg{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    overflow:visible;
}

.chart-empty{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--muted);
    font-size:12px;
    text-align:center;
    padding:30px;
}

/* GOALS */

.goal-card{
    background:linear-gradient(145deg,#122238,#0e1b2b);
    border:1px solid var(--border);
    border-radius:22px;
    padding:18px;
    margin-top:12px;
}

.goal-top{
    display:flex;
    justify-content:space-between;
    gap:12px;
}

.goal-name{
    font-size:17px;
    font-weight:bold;
}

.goal-target{
    color:var(--muted);
    font-size:12px;
    margin-top:4px;
}

.goal-percent{
    color:var(--green);
    font-weight:bold;
    font-size:17px;
}

.goal-values{
    display:flex;
    justify-content:space-between;
    margin:18px 0 8px;
    font-size:12px;
}

.goal-values span:first-child{
    font-weight:bold;
}

.goal-details{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:8px;
    margin-top:15px;
}

.goal-detail{
    background:rgba(255,255,255,.035);
    border-radius:12px;
    padding:10px;
}

.goal-detail small{
    display:block;
    color:var(--muted);
    font-size:9px;
}

.goal-detail strong{
    display:block;
    font-size:12px;
    margin-top:3px;
}

.goal-actions{
    display:grid;
    grid-template-columns:1fr 1fr 42px;
    gap:8px;
    margin-top:14px;
}

.btn{
    border-radius:12px;
    padding:12px;
    font-weight:bold;
    font-size:12px;
}

.btn-green{
    background:var(--green);
    color:#04150d;
}

.btn-dark{
    background:#18283d;
    color:white;
    border:1px solid var(--border);
}

.btn-icon{
    background:#18283d;
    color:white;
}

/* ANALYSIS */

.analysis-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
}

.analysis-item{
    background:#0c1929;
    border-radius:15px;
    padding:14px;
}

.analysis-item span{
    display:block;
    color:var(--muted);
    font-size:10px;
}

.analysis-item strong{
    display:block;
    margin-top:5px;
    font-size:16px;
}

/* CALENDAR */

.calendar-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:15px;
}

.calendar-head button{
    width:32px;
    height:32px;
    border-radius:10px;
    background:#18283d;
    color:white;
}

.calendar-week,
.calendar-days{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:5px;
}

.calendar-week div{
    text-align:center;
    color:var(--muted);
    font-size:9px;
}

.day{
    min-height:42px;
    background:#0c1929;
    border-radius:9px;
    padding:5px;
    font-size:10px;
    text-align:center;
    position:relative;
}

.day.empty{
    background:transparent;
}

.day.has-money{
    border:1px solid rgba(40,209,124,.4);
    background:rgba(40,209,124,.08);
}

.day.today{
    box-shadow:inset 0 0 0 1px var(--blue);
}

.day-value{
    color:var(--green);
    font-size:8px;
    margin-top:4px;
    font-weight:bold;
}

/* CHALLENGES */

.challenge{
    background:#0d1b2c;
    border:1px solid var(--border);
    border-radius:18px;
    padding:15px;
    margin-top:10px;
}

.challenge-top{
    display:flex;
    justify-content:space-between;
}

.challenge-name{
    font-weight:bold;
}

.challenge-percent{
    color:var(--green);
    font-size:12px;
    font-weight:bold;
}

.challenge-info{
    color:var(--muted);
    font-size:10px;
    margin-top:5px;
}

.challenge-progress{
    height:7px;
    background:#18283a;
    border-radius:99px;
    margin-top:12px;
    overflow:hidden;
}

.challenge-progress div{
    height:100%;
    background:linear-gradient(90deg,var(--purple),var(--green));
}

/* ACHIEVEMENTS */

.badges{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:9px;
}

.badge{
    background:#0c1929;
    border:1px solid var(--border);
    border-radius:17px;
    padding:15px 7px;
    text-align:center;
    opacity:.35;
}

.badge.unlocked{
    opacity:1;
    border-color:rgba(40,209,124,.35);
    background:linear-gradient(145deg,#102b25,#0c1929);
}

.badge-icon{
    font-size:28px;
}

.badge-name{
    font-size:9px;
    margin-top:7px;
    font-weight:bold;
}

.badge-status{
    font-size:8px;
    color:var(--muted);
    margin-top:4px;
}

/* SIMULATOR */

.simulator-result{
    margin-top:15px;
    background:#0b1828;
    border-radius:15px;
    padding:15px;
}

.sim-row{
    display:flex;
    justify-content:space-between;
    padding:10px 0;
    border-bottom:1px solid var(--border);
    font-size:12px;
}

.sim-row:last-child{
    border:0;
}

.sim-row strong{
    color:var(--green);
}

/* FORMS */

.form-group{
    margin-top:13px;
}

.form-group label{
    display:block;
    color:var(--muted);
    font-size:11px;
    margin-bottom:6px;
}

.input{
    width:100%;
    padding:13px;
    border-radius:12px;
    border:1px solid var(--border);
    background:#091625;
    color:white;
    outline:none;
}

.input:focus{
    border-color:var(--green);
}

.form-actions{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:9px;
    margin-top:17px;
}

/* EMPTY */

.empty{
    text-align:center;
    padding:35px 15px;
    color:var(--muted);
}

.empty-icon{
    font-size:38px;
    margin-bottom:10px;
}

/* NAV */

.bottom-nav{
    position:fixed;
    left:50%;
    transform:translateX(-50%);
    bottom:0;
    width:min(700px,100%);
    padding:8px 8px calc(8px + env(safe-area-inset-bottom));
    background:rgba(5,13,23,.94);
    backdrop-filter:blur(18px);
    border-top:1px solid var(--border);
    z-index:50;
    display:grid;
    grid-template-columns:repeat(5,1fr);
}

.nav-btn{
    background:transparent;
    color:#718096;
    padding:7px 2px;
    border-radius:12px;
    font-size:9px;
}

.nav-btn span{
    display:block;
    font-size:18px;
    margin-bottom:3px;
}

.nav-btn.active{
    color:var(--green);
}

/* MODAL */

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.72);
    backdrop-filter:blur(5px);
    display:none;
    align-items:flex-end;
    justify-content:center;
    z-index:100;
}

.modal.show{
    display:flex;
}

.modal-box{
    width:min(700px,100%);
    max-height:90vh;
    overflow:auto;
    background:#0c1929;
    border:1px solid var(--border);
    border-radius:25px 25px 0 0;
    padding:22px;
    animation:up .25s ease;
}

@keyframes up{
    from{transform:translateY(100%)}
    to{transform:translateY(0)}
}

.modal-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.close{
    width:34px;
    height:34px;
    border-radius:10px;
    background:#17283c;
    color:white;
}

/* TOAST */

.toast{
    position:fixed;
    left:50%;
    bottom:85px;
    transform:translateX(-50%) translateY(20px);
    background:#13263a;
    border:1px solid rgba(255,255,255,.1);
    color:white;
    padding:12px 17px;
    border-radius:13px;
    font-size:12px;
    opacity:0;
    pointer-events:none;
    transition:.25s;
    z-index:200;
    white-space:nowrap;
}

.toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
}

/* RESPONSIVE */

@media(min-width:600px){
    .metrics{
        grid-template-columns:repeat(4,1fr);
    }

    .analysis-grid{
        grid-template-columns:repeat(4,1fr);
    }

    .goal-details{
        grid-template-columns:repeat(4,1fr);
    }
}
</style>
</head>

<body>

<div class="app">

<header class="topbar">
    <div class="brand">
        <div class="brand-icon">🎯</div>
        <div class="brand-text">
            <strong>Minha Meta</strong>
            <span>PRO</span>
        </div>
    </div>
    <div class="user-circle" id="userInitial">M</div>
</header>


<!-- ================= DASHBOARD ================= -->

<section class="page active" id="page-dashboard">

    <div class="hero">
        <div class="pro-label">✦ MINHA META PRO</div>

        <div class="hero-small">Total guardado</div>
        <div class="hero-value" id="totalSaved">R$ 0,00</div>
        <div class="hero-sub" id="heroGoalText">Comece adicionando sua primeira meta.</div>

        <div class="hero-progress">
            <div class="progress-line">
                <div class="progress-fill" id="generalProgress"></div>
            </div>
            <div class="progress-info">
                <span id="generalProgressText">0% do objetivo geral</span>
                <span id="totalTarget">R$ 0,00</span>
            </div>
        </div>
    </div>

    <div class="metrics">

        <div class="metric">
            <div class="metric-icon">🎯</div>
            <div class="metric-label">Metas ativas</div>
            <div class="metric-value" id="metricGoals">0</div>
        </div>

        <div class="metric">
            <div class="metric-icon">🔥</div>
            <div class="metric-label">Sequência</div>
            <div class="metric-value" id="metricStreak">0 dias</div>
        </div>

        <div class="metric">
            <div class="metric-icon">📅</div>
            <div class="metric-label">Por dia</div>
            <div class="metric-value" id="metricDaily">R$ 0,00</div>
        </div>

        <div class="metric">
